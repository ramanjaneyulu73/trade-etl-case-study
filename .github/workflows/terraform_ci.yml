name: Terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_ci.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform_ci.yml"

jobs:
  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      - name: terraform init
        run: terraform init

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        if: ${{ env.SNOWFLAKE_ACCOUNT != '' }}
        run: |
          export TF_VAR_snowflake_organization_name="${SNOWFLAKE_ACCOUNT_FULL%%-*}"
          export TF_VAR_snowflake_account_name="${SNOWFLAKE_ACCOUNT_FULL#*-}"
          terraform plan -no-color
        env:
          SNOWFLAKE_ACCOUNT_FULL: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          TF_VAR_snowflake_admin_user: ${{ secrets.SNOWFLAKE_USER }}
          TF_VAR_snowflake_admin_password: ${{ secrets.SNOWFLAKE_PASSWORD }}
          TF_VAR_service_user_name: ${{ secrets.SNOWFLAKE_USER }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}

  # Deploy: only on a real merge to main (never on pull_request), and gated
  # behind the "production" GitHub Environment's required reviewer - infra
  # changes only go live after a human clicks Approve, not automatically.
  terraform-apply:
    needs: terraform
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform
    env:
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.8"

      - name: terraform init
        run: terraform init

      - name: terraform apply (deploy)
        if: ${{ env.SNOWFLAKE_ACCOUNT != '' }}
        run: |
          export TF_VAR_snowflake_organization_name="${SNOWFLAKE_ACCOUNT_FULL%%-*}"
          export TF_VAR_snowflake_account_name="${SNOWFLAKE_ACCOUNT_FULL#*-}"
          terraform apply -auto-approve -no-color
        env:
          SNOWFLAKE_ACCOUNT_FULL: ${{ secrets.SNOWFLAKE_ACCOUNT }}
          TF_VAR_snowflake_admin_user: ${{ secrets.SNOWFLAKE_USER }}
          TF_VAR_snowflake_admin_password: ${{ secrets.SNOWFLAKE_PASSWORD }}
          TF_VAR_service_user_name: ${{ secrets.SNOWFLAKE_USER }}
          TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
