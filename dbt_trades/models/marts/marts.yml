version: 2

models:
  - name: int_trade_classification
    description: Every raw trade message classified against the business rules; the single source both fact tables read from.
    columns:
      - name: trade_id
        tests:
          - not_null
      - name: disposition
        tests:
          - not_null
          - accepted_values:
              values:
                - VALID_CURRENT
                - REJECTED_LOWER_VERSION
                - SUPERSEDED_SAME_VERSION
                - REJECTED_PAST_MATURITY
                - REJECTED_INVALID_NOTIONAL
                - REJECTED_INVALID_CURRENCY
                - REJECTED_INVALID_DATES

  - name: fct_valid_trades
    description: Current state, one row per trade_id, of every trade that has passed validation.
    columns:
      - name: trade_id
        tests:
          - unique
          - not_null
      - name: trade_status
        tests:
          - not_null
          - accepted_values:
              values: ['ACTIVE', 'EXPIRED']

  - name: fct_rejected_trades
    description: Append-only compliance audit log of every rejected trade message.
    columns:
      - name: rejection_reason
        tests:
          - not_null
