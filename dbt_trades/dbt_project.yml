name: 'trade_etl'
version: '1.0.0'
config-version: 2

profile: 'trade_etl'

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  valid_currencies: ['USD', 'EUR', 'GBP', 'JPY', 'INR', 'AUD', 'CHF']

models:
  trade_etl:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: incremental
      +schema: marts

# mark_expired_trades() is invoked as an explicit step after `dbt run`
# (dbt run-operation mark_expired_trades), not via on-run-end: its ref()
# inside an `execute`-guarded block can't be statically resolved into a
# hook dependency by dbt >=1.9's stricter graph inference, and an explicit
# step is what both the setup guide and the Airflow DAG already use anyway.
